<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My Chicago Map</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    <body>
        <h1>Chicago, Illinois</h1>
        <p>Esri World Imagery basemap, starting at zoom level 11.</p>
        <div id="mymap" style="height: 800px" aria-label="Interactive map of Chicago"></div>
        <script>
            // Set the map center and starting zoom level.
            var map = L.map('mymap', {
                center: [41.8781, -87.6298],
                zoom: 11
            });

            // Add the satellite imagery basemap.
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                minZoom: 2,
                maxZoom: 20
            }).addTo(map);
        </script>
    </body>
</html>
