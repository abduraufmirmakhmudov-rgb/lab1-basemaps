<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4: Chicago Layers Control</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data.js"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; }
        #map { height: 100%; }
        .heading, .legend { padding: 8px; background: rgba(255,255,255,0.95); }
        .heading { max-width: 260px; }
        .heading h1 { font-size: 18px; margin: 0 0 6px; }
        .heading p { margin: 0; font-size: 12px; }
        .legend { line-height: 22px; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; border: 1px solid gray; }
    </style>
</head>
<body>
    <div id="map" aria-label="Chicago population density map with basemap and overlay controls"></div>
    <script>
        var map = L.map('map', { center: [41.84, -87.68], zoom: 10 });

        var canvas = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        });

        function getColor(value) {
            return value > 8300 ? '#54278f' :
                   value > 5400 ? '#756bb1' :
                   value > 3900 ? '#9e9ac8' :
                   value > 1900 ? '#cbc9e2' :
                                  '#f2f0f7';
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.PopDen),
                weight: 2,
                opacity: 1,
                color: 'gray',
                fillOpacity: 0.8
            };
        }

        function onEachFeature(feature, layer) {
            layer.bindTooltip(feature.properties.community + '<br>' +
                feature.properties.PopDen.toFixed(1) + ' people/km² (2010)', { sticky: true });
        }

        var communityAreas = L.geoJson(data, {
            style: style,
            onEachFeature: onEachFeature
        }).addTo(map);
        map.fitBounds(communityAreas.getBounds(), { padding: [20, 20] });

        // This NASA layer is a composite image, so it does not need a daily date.
        var nasa = L.tileLayer.wms('https://gibs.earthdata.nasa.gov/wms/epsg3857/best/wms.cgi?', {
            layers: 'BlueMarble_ShadedRelief_Bathymetry',
            format: 'image/png',
            transparent: true,
            opacity: 0.6,
            attribution: 'Imagery courtesy of NASA EOSDIS GIBS'
        });

        var basemaps = {
            'Light Gray Canvas': canvas,
            'OpenStreetMap': streets
        };
        var overlaymaps = {
            'Chicago Population Density (2010)': communityAreas,
            'NASA Blue Marble (WMS)': nasa
        };
        L.control.layers(basemaps, overlaymaps, { collapsed: false }).addTo(map);

        var heading = L.control({ position: 'bottomleft' });
        heading.onAdd = function () {
            var div = L.DomUtil.create('div', 'heading');
            div.innerHTML = '<h1>Chicago Population Density</h1>' +
                '<p>Lab 4: Layers Control<br>Community areas, 2010. Use the controls to switch basemaps and turn overlays on or off. Zoom out to see more of the NASA imagery.</p>';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        heading.addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            var grades = [0, 1900, 3900, 5400, 8300];
            var labels = ['0–1,900', '>1,900–3,900', '>3,900–5,400', '>5,400–8,300', '>8,300'];
            div.innerHTML = '<b>Population density, 2010</b><br>People per km²<br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML += '<i style="background:' + getColor(grades[i] + 1) + '"></i>' + labels[i] + '<br>';
            }
            div.innerHTML += '<small>Source: Lab 3 community-area data</small>';
            return div;
        };
        legend.addTo(map);

        map.on('overlayremove', function (eventLayer) {
            if (eventLayer.layer === communityAreas) {
                map.removeControl(legend);
            }
        });
        map.on('overlayadd', function (eventLayer) {
            if (eventLayer.layer === communityAreas) {
                legend.addTo(map);
            }
        });
    </script>
</body>
</html>
