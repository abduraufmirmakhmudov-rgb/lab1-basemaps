<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 3: Chicago Population Density</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data.js"></script>
    <style>
        #map { height: 600px; }
        .legend { padding: 8px; line-height: 22px; background: white; }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; border: 1px solid gray; }
    </style>
</head>
<body>
    <h1>Lab 3: Chicago Population Density</h1>
    <p>This map shows population density in Chicago community areas in 2010.
        Move the mouse over an area to see its name and density.</p>
    <div id="map" aria-label="Choropleth map of population density in Chicago community areas"></div>
    <p>Data: <a href="https://neiugis.github.io/lab3/">Lab 3 Chicago Community Area dataset</a>.
        Colors: ColorBrewer 5-class Purples (colorblind-safe).</p>
    <script>
        var map = L.map('map', { center: [41.84, -87.68], zoom: 10 });
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            minZoom: 7,
            maxZoom: 14
        }).addTo(map);

        // Five classes based on QGIS natural breaks, rounded up to the nearest 100.
        function getColor(value) {
            return value > 8300 ? '#54278f' :
                   value > 5400 ? '#756bb1' :
                   value > 3900 ? '#9e9ac8' :
                   value > 1900 ? '#cbc9e2' :
                                  '#f2f0f7';
        }

        function style(feature) {
            return {
                fillColor: getColor(feature.properties.PopDen),
                weight: 2,
                opacity: 1,
                color: 'gray',
                dashArray: '4',
                fillOpacity: 0.9
            };
        }

        function highlightFeature(e) {
            var feature = e.target;
            feature.setStyle({ weight: 5, color: 'white', dashArray: '', fillOpacity: 0.9 });
            feature.bringToFront();
        }

        var geojson;
        function resetHighlight(e) {
            geojson.resetStyle(e.target);
        }

        function onEachFeature(feature, layer) {
            layer.on({ mouseover: highlightFeature, mouseout: resetHighlight });
            layer.bindTooltip(feature.properties.community + '<br>' +
                feature.properties.PopDen.toFixed(1) + ' people/km² (2010)', { sticky: true });
        }

        geojson = L.geoJson(data, { style: style, onEachFeature: onEachFeature }).addTo(map);
        map.fitBounds(geojson.getBounds(), { padding: [15, 15] });

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend');
            var grades = [0, 1900, 3900, 5400, 8300];
            var labels = ['0–1,900', '>1,900–3,900', '>3,900–5,400', '>5,400–8,300', '>8,300'];
            div.innerHTML = '<b>Population density, 2010</b><br>People per km²<br>';
            for (var i = 0; i < grades.length; i++) {
                div.innerHTML += '<i style="background:' + getColor(grades[i] + 1) + '"></i>' + labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
